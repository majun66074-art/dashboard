            font-weight: 700;

        .kpi-delta.down { color: #dc2626; }
        .kpi-delta.neutral { color: #6b7280; }

            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 16px;

        @media (max-width: 480px) { .status-bar { grid-template-columns: 1fr; } }

            border: 1px solid #e5e7eb;

        .status-dot.warning { background: #dc2626; }

            border-radius: 10px;

        .alert-title {
            font-size: 14px;
            font-weight: 700;
            color: #b91c1c;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;

        .alert-list { list-style: none; }
        .alert-list li {

            color: #7f1d1d;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sparkline {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 20px;
        }
        .sparkbar {
            width: 5px;
            background: #ef4444;
            border-radius: 1px;
            opacity: 0.7;

            border-radius: 10px;

            margin-bottom: 16px;
            font-size: 13px;
            color: #1e40af;

            grid-template-columns: 1.2fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
