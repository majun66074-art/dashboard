            margin-bottom: 16px;

        @media (max-width: 480px) { .kpis { grid-template-columns: 1fr; } }
        .kpi {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            border: 1px solid #e5e7eb;
        }
        .kpi-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 6px;
        }
        .kpi-value {
            font-size: 26px;
            font-weight: 700;
            color: #111827;
        }
        .kpi-delta {
            font-size: 12px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kpi-delta.up { color: #16a34a; }
        .kpi-delta.down { color: #dc2626; }
        .kpi-delta.neutral { color: #6b7280; }

        /* 状态分布 */

            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 16px;

            border-radius: 10px;
            padding: 14px 18px;

            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);

        .status-name { font-size: 13px; color: #4b5563; display: flex; align-items: center; gap: 8px; }

        .status-dot.active { background: #16a34a; }
        .status-dot.warning { background: #dc2626; }
        .status-dot.yesterday { background: #f59e0b; }
        .status-dot.silent { background: #9ca3af; }
        .status-count { font-size: 20px; font-weight: 700; color: #111827; }

        /* 预警 */
        .alert {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: none;

        .alert.show { display: block; }
        .alert-title {
            font-size: 14px;
            font-weight: 700;
            color: #b91c1c;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .alert-list { list-style: none; }
        .alert-list li {
            font-size: 13px;
            color: #7f1d1d;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sparkline {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 20px;
        }
        .sparkbar {
            width: 5px;
            background: #ef4444;
            border-radius: 1px;
            opacity: 0.7;

            border: 1px solid #dbeafe;
            border-radius: 10px;

            margin-bottom: 16px;
            font-size: 13px;
            color: #1e40af;

            grid-template-columns: 1.2fr 1fr;
            gap: 14px;
            margin-bottom: 16px;

        footer {

            padding: 20px 0 4px;
            font-size: 12px;
            color: #9ca3af;
